{% load static %}

<!DOCTYPE html>
<html>
<head>

    <title>Register - GenYoga</title>

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>GenYoga</h1>

        <p class="subtitle">
            Create Your Account
        </p>

        <form method="POST">

            {% csrf_token %}

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password1"
                   placeholder="Password"
                   required>

            <input type="password"
                   name="password2"
                   placeholder="Confirm Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="switch-link">
            Already have an account?
            <a href="{% url 'login' %}">
                Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
